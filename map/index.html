<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eagleburger Mapping Thingy</title>

  <!-- Google Fonts: Solway -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Google Material Symbols (Outlined) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/map/style.css" />
</head>

<body>

  <!-- Loading Overlay -->
  <div id="initial-loader">
    <div class="spinner"></div>
    <p>Locating...</p>
  </div>

  <!-- Floating Search Bar -->
  <form id="search-form" class="search-container">
    <input type="text" id="address-input" placeholder="Enter an address or landmark..." autocomplete="off" required />
    <button type="button" id="clear-btn" title="Clear search">
      <span class="material-symbols-outlined">close</span>
    </button>
    <button type="submit" id="search-btn">
      <span class="material-symbols-outlined">search</span>
    </button>
  </form>

  <!-- Floating Map Utility with Vertical Zoom Slider -->
  <div id="zoom-controls" class="zoom-container">
    <button type="button" id="zoom-in-btn" title="Zoom In">
      <span class="material-symbols-outlined">add</span>
    </button>

    <div class="slider-wrapper">
      <input type="range" id="zoom-slider" min="1" max="19" step="1" value="16" title="Zoom Level" />
    </div>

    <button type="button" id="zoom-out-btn" title="Zoom Out">
      <span class="material-symbols-outlined">remove</span>
    </button>
    <button type="button" id="zoom-reset-btn" title="Reset Default Zoom">
      <span class="material-symbols-outlined">restart_alt</span>
    </button>
    <button type="button" id="locate-btn" title="Go to Current Location">
      <span class="material-symbols-outlined">my_location</span>
    </button>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/map/app.js"></script>
</body>

</html>
