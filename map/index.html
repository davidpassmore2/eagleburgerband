<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eagleburger Mapper Thingy</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/map/style.css" />
</head>

<body>

    <div id="initial-loader">
        <div class="spinner"></div>
        <p>Locating...</p>
    </div>

    <form id="search-form" class="search-container">
        <input type="text" id="address-input" placeholder="Enter an address or landmark..." autocomplete="off"
            required />
        <button type="button" id="clear-btn" title="Clear search">✕</button>
        <button type="submit" id="search-btn">Search</button>
    </form>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/map/app.js"></script>
</body>

</html>
