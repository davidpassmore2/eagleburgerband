<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eagleburger Mapper Thingy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="/map/style.css" />
</head>
<body>

  <div id="initial-loader">
    <div class="spinner"></div>
    <p>Locating...</p>
  </div>

  <form id="search-form" class="search-container">
    <input 
      type="text" 
      id="address-input" 
      placeholder="Enter an address or landmark..." 
      autocomplete="off" 
      required 
    />
    <button type="button" id="clear-btn" title="Clear search">✕</button>
    <button type="submit" id="search-btn">Search</button>
  </form>

  <div id="zoom-controls" class="zoom-container">
    <button type="button" id="zoom-in-btn" title="Zoom In">+</button>
    <button type="button" id="zoom-out-btn" title="Zoom Out">−</button>
    <button type="button" id="zoom-reset-btn" title="Reset to Default Zoom">⟲</button>
  </div>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="/map/app.js"></script>
</body>
</html>
